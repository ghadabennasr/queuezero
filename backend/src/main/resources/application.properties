spring.application.name=backend

# --- Database (dev defaults; override with environment variables in Docker/prod) ---
spring.datasource.url=${QZ_DB_URL:jdbc:postgresql://127.0.0.1:5432/queuezero}
spring.datasource.username=${QZ_DB_USER:queuezero}
spring.datasource.password=${QZ_DB_PASSWORD:QueueZeroDev2026}

# --- JPA: Hibernate only VALIDATES; Flyway owns the schema ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8081

# --- Simulation ---
queuezero.simulation.enabled=true
queuezero.simulation.backfill-days=14
queuezero.simulation.zone=Africa/Tunis

# --- JWT (the secret MUST be overridden with QZ_JWT_SECRET outside local development) ---
queuezero.security.jwt.secret=${QZ_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
queuezero.security.jwt.expiration-minutes=30
